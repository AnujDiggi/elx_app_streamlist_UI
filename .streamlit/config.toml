[server]
# Enable the file watcher to automatically reload when files change
fileWatcherType = "auto"

# Enable script rerunning
runOnSave = true

# Set headless mode to true
headless = false

# Watch for changes in these directories (includes all Python files)
folderWatchBlacklist = []

[logger]
# Set to a reasonable level
level = "info"

[theme]
primaryColor = "#1f77b4"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f2f6"
textColor = "#262730"
font = "sans serif"
